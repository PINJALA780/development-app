name: FastAPI CI/CD For Backstage and Crossplane

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # 3. Upgrade pip and install dependencies
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # ==================================================
      # 4. Run Unit Tests
      # ==================================================
      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest

      # ==================================================
      # 5. Build Docker Image
      # ==================================================
      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest \
            .

      # ==================================================
      # 6. Trivy Security Scan
      # ==================================================
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"

      # ==================================================
      # 7. Login to Docker Hub
      # ==================================================
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==================================================
      # 8. Push Docker Image
      # ==================================================
      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest

      # ==================================================
      # 9. Configure AWS
      # ==================================================
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ==================================================
      # 10. Configure kubectl
      # ==================================================
      - name: Configure kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      # ==================================================
      # 11. Verify EKS
      # ==================================================
      - name: Verify EKS Cluster
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl get nodes

      # ==================================================
      # 12. Create Namespace
      # ==================================================
      - name: Deploy Namespace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f k8s/namespace.yaml

      # ==================================================
      # 13. Deploy ConfigMap
      # ==================================================
      - name: Deploy ConfigMap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f k8s/configmap.yaml

      # ==================================================
      # 14. Deploy Application
      # ==================================================
      - name: Deploy Application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 15. Update Deployment Image
      # ==================================================
      - name: Update Deployment Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl set image \
            deployment/${{ github.event.repository.name }} \
            ${{ github.event.repository.name }}=${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }} \
            -n ${{ github.event.repository.name }}

      # ==================================================
      # 16. Wait for Rollout
      # ==================================================
      - name: Wait for Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl rollout status \
            deployment/${{ github.event.repository.name }} \
            -n ${{ github.event.repository.name }} \
            --timeout=180s

      # ==================================================
      # 17. Verify Deployment
      # ==================================================
      - name: Verify Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments \
            -n ${{ github.event.repository.name }}

          echo "===== PODS ====="
          kubectl get pods \
            -n ${{ github.event.repository.name }}

          echo "===== SERVICES ====="
          kubectl get services \
            -n ${{ github.event.repository.name }}
